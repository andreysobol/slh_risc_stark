[package]
name = "slh-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
openvm = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-build = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-sdk = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-sdk-config = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-stark-sdk = { git = "https://github.com/openvm-org/stark-backend.git", tag = "v2.1.0" }
openvm-stark-backend = { git = "https://github.com/openvm-org/stark-backend.git", tag = "v2.1.0" }
slh-core = { path = "../slh-core", features = ["instrument"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
eyre = "0.6"
